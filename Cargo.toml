[workspace]
resolver = "2"
members = [
    "crates/xz-core",
    "crates/xz-bench",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/XuanzeNetDev/xuanze-password-manager"
authors = ["璇泽网络科技 <xuanze@wordpeak.cn>"]

[workspace.dependencies]
xz-core = { path = "crates/xz-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive", "derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
subtle = "2"

# 性能优先：release 全量优化 + LTO + panic=abort
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

# 日常开发/调试专用：链接快，改前端后重编 1-3 秒。
# 只是调试用，发布仍然走 release（全量 LTO）。
[profile.dev-fast]
inherits = "release"
lto = false
codegen-units = 256
opt-level = 1
strip = false
debug = false
panic = "abort"

# 基准专用：带符号但不瘦身，便于 perf 采样
[profile.benchopt]
inherits = "release"
debug = 1
strip = "none"
