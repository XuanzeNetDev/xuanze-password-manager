name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: 核心库与 CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 单元测试
        run: cargo test -p xz-core

      - name: Clippy（warning 也当错误）
        run: cargo clippy -p xz-core --all-targets -- -D warnings

  desktop:
    name: 桌面壳
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # 顺序有讲究：setup-node 的 cache: pnpm 需要 pnpm 已经装好，
      # 所以 pnpm/action-setup 必须排前面。反了会在 setup-node 那步直接失败。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 前端依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 前端构建
        run: pnpm run build

      - name: Rust 检查
        run: cargo clippy -p xuanze-vault --all-targets -- -D warnings

      # 桌面壳里真正会被执行到的测试（xlsx 读写、导出导入逐字段往返、
      # 稀疏单元格与共享字符串解析）都挂在 lib 的 #[cfg(test)] 上。
      # 只跑 clippy 的话，这些测试在 CI 里一次都不会被执行 ——
      # 「导入会丢自定义字段」这类缺陷就是这样漏过去的。
      #
      # --lib 是必须的：不要拉起 GUI/二进制目标，否则 runner 上会去连
      # 交互式桌面而失败。
      - name: 桌面壳单元测试
        run: cargo test -p xuanze-vault --lib
